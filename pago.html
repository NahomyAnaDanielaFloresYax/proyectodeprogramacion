<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pago con tarjeta</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffe6f0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* caja */
.card-box {
  background: white;
  width: 360px;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* título */
h2 {
  text-align: center;
  color: #d8a694;
  margin-bottom: 20px;
}

/* grupos */
.input-group {
  position: relative;
  margin-bottom: 15px;
}

.input-group i {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #d8a694;
}

.input-group input {
  width: 100%;
  padding: 10px 10px 10px 35px;
  border-radius: 10px;
  border: 1px solid #ccc;
  outline: none;
}

.input-group input:focus {
  border-color: #d8a694;
}

/* botón */
button {
  width: 100%;
  padding: 12px;
  background: #d8a694;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #ad2a6c;
}

/* íconos tarjetas */
.cards {
  text-align: center;
  margin-bottom: 15px;
}

.cards i {
  font-size: 26px;
  margin: 0 5px;
  color: #d8a694;
}

/* mensaje */
#msg {
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card-box">

  <h2>Pago con tarjeta</h2>

  <div class="cards">
    <i class="fa-brands fa-cc-visa"></i>
    <i class="fa-brands fa-cc-mastercard"></i>
    <i class="fa-brands fa-cc-amex"></i>
  </div>

  <form id="cardForm">

    <div class="input-group">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="name" placeholder="Nombre en la tarjeta" required>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-credit-card"></i>
      <input type="text" id="cardNumber" placeholder="Número de tarjeta" maxlength="16" required>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-calendar"></i>
      <input type="month" id="expiry" required>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="cvv" placeholder="CVV" maxlength="3" required>
    </div>

    <button type="submit">Pagar ahora 💳</button>

    <div id="msg"></div>

  </form>

</div>

<script>
document.getElementById("cardForm").addEventListener("submit", function(e){
  e.preventDefault();

  const number = document.getElementById("cardNumber").value;
  const cvv = document.getElementById("cvv").value;
  const msg = document.getElementById("msg");

  // validación básica
  if (!/^\d{16}$/.test(number)) {
    msg.style.color = "red";
    msg.innerText = "❌ Número de tarjeta inválido";
    return;
  }

  if (!/^\d{3}$/.test(cvv)) {
    msg.style.color = "red";
    msg.innerText = "❌ CVV inválido";
    return;
  }

  msg.style.color = "green";
  msg.innerText = "✅ Pago procesado correctamente";

  setTimeout(() => {
    alert("Gracias por tu compra 💖");
    window.location.href = "index.html"; // o tu página principal
  }, 1500);
});
</script>

</body>
</html>
